name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # Called by the Release workflow when release-please cuts a release.
  # Tags created by release-please use GITHUB_TOKEN and therefore never
  # trigger a `push: tags` event, so the release build is invoked explicitly.
  workflow_call:
    inputs:
      version:
        description: Semantic version of the release (e.g. 0.1.5), without prefix
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=raw,value=latest,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !startsWith(inputs.version, '0.') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger GitLab pipeline
        if: success() && github.ref == 'refs/heads/main' && inputs.version == ''
        run: |
          curl --fail -X POST \
            "https://source.factorial.io/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline" \
            -F "token=${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            -F "ref=main"

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io
